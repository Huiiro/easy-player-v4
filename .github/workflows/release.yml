name: Release desktop apps

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Ensure the tag matches package.json
        if: github.ref_type == 'tag'
        run: |
          node -e "const actual = 'v' + require('./package.json').version; if (actual !== process.env.GITHUB_REF_NAME) { console.error('Version mismatch: expected ' + actual + ', got ' + process.env.GITHUB_REF_NAME); process.exit(1) }"

  package-windows:
    needs: verify-version
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      VCPKG_ROOT: ${{ runner.temp }}\easy-player-vcpkg
      ELECTRON_BUILDER_7Z_FILTER: BCJ
      ELECTRON_BUILDER_COMPRESSION_LEVEL: '9'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Install native dependencies
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg "$env:VCPKG_ROOT"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:VCPKG_ROOT/bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:VCPKG_ROOT/vcpkg.exe" install ffmpeg libsamplerate soundtouch --triplet x64-windows
      - name: Build Windows installer
        shell: pwsh
        run: |
          $env:ELECTRON_BUILDER_7Z_FILTER = 'BCJ'
          $env:ELECTRON_BUILDER_COMPRESSION_LEVEL = '9'
          npm run build:win -- --publish never
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-windows-package.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installer = Get-ChildItem dist\*-setup.exe | Select-Object -First 1
          if ($null -eq $installer) { throw 'Windows installer was not generated' }
          Write-Host "Windows installer size: $([math]::Round($installer.Length / 1MB, 1)) MiB"
          if ($installer.Length -gt 250MB) { throw 'Windows installer exceeds 250 MiB; refusing to publish' }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml

  package-macos:
    needs: verify-version
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install native dependencies
        run: brew install ffmpeg libsamplerate sound-touch
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Build macOS package
        run: npm run build:mac -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: macos-release
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/*.dmg.blockmap
            dist/*-mac.zip
            dist/*-mac.zip.blockmap
            dist/latest-mac.yml

  package-linux:
    needs: verify-version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Build Linux packages
        run: npm run build:linux -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: linux-release
          if-no-files-found: error
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/latest-linux.yml

  publish:
    needs: [package-windows, package-macos, package-linux]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref_type == 'tag'
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create GitHub release and upload artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes
