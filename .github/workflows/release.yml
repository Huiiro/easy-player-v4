name: Release desktop apps

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Build targets (desktop = Windows x64 + Mac ARM64; manual runs do not publish)'
        type: choice
        options: [desktop, windows, macos, all]
        default: desktop

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Ensure the tag matches package.json
        if: github.ref_type == 'tag'
        run: |
          node -e "const actual = 'v' + require('./package.json').version; if (actual !== process.env.GITHUB_REF_NAME) { console.error('Version mismatch: expected ' + actual + ', got ' + process.env.GITHUB_REF_NAME); process.exit(1) }"
      - name: Ensure package-lock version is synchronized
        run: |
          node -e "const pkg = require('./package.json'), lock = require('./package-lock.json'); if (lock.version !== pkg.version || lock.packages[''].version !== pkg.version) throw new Error('package.json and package-lock.json versions must match')"

  package-windows:
    if: github.event_name == 'push' || inputs.platforms == 'desktop' || inputs.platforms == 'windows' || inputs.platforms == 'all'
    needs: verify-version
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      ELECTRON_BUILDER_7Z_FILTER: BCJ
      ELECTRON_BUILDER_COMPRESSION_LEVEL: '9'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install JavaScript dependencies
        run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Prepare yt-dlp
        run: npm run prepare:ytdlp
      - name: Install native dependencies
        run: npm run prepare:native
      - name: Build Windows installer
        shell: pwsh
        run: |
          $env:ELECTRON_BUILDER_7Z_FILTER = 'BCJ'
          $env:ELECTRON_BUILDER_COMPRESSION_LEVEL = '9'
          npm run build:win -- --publish never
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-windows-package.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:audio-core
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:packaging-deps
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run package:auto-mix
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:bundled-auto-mix
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:auto-mix-runtime
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/test-native-runtime-paths.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:auto-mix-component-install
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $installer = Get-Item -LiteralPath (Join-Path 'dist' "$($pkg.name)-$($pkg.version)-setup.exe")
          if ($null -eq $installer) { throw 'Windows installer was not generated' }
          Write-Host "Windows installer size: $([math]::Round($installer.Length / 1MB, 1)) MiB"
          if ($installer.Length -gt 250MB) { throw 'Windows base installer exceeds 250 MiB; refusing to publish' }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/*.yml
            !dist/builder-debug.yml
            dist/easy-player-auto-mix-*.zip
            dist/easy-player-auto-mix-*.json

  package-macos:
    if: github.event_name == 'push' || inputs.platforms == 'desktop' || inputs.platforms == 'macos' || inputs.platforms == 'all'
    needs: verify-version
    uses: ./.github/workflows/macos-ci.yml
    with:
      artifact_name: macos-release

  package-linux:
    if: github.event_name == 'workflow_dispatch' && inputs.platforms == 'all'
    needs: verify-version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Prepare yt-dlp
        run: npm run prepare:ytdlp
      - name: Build Linux packages
        run: npm run build:linux -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: linux-release
          if-no-files-found: error
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.yml
            !dist/builder-debug.yml

  publish:
    needs: [package-windows, package-macos, package-linux]
    runs-on: ubuntu-latest
    if: always() && github.event_name == 'push' && github.ref_type == 'tag' && needs.package-windows.result == 'success' && needs.package-macos.result == 'success' && (needs.package-linux.result == 'success' || needs.package-linux.result == 'skipped')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create GitHub release and upload artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=()
          if [[ "$TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes "${flags[@]}"
