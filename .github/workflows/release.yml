name: Release desktop apps

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Ensure the tag matches package.json
        if: github.ref_type == 'tag'
        run: |
          node -e "const actual = 'v' + require('./package.json').version; if (actual !== process.env.GITHUB_REF_NAME) { console.error('Version mismatch: expected ' + actual + ', got ' + process.env.GITHUB_REF_NAME); process.exit(1) }"

  package-windows:
    needs: verify-version
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      VCPKG_ROOT: ${{ github.workspace }}\vcpkg
      # Leave these secrets unset to produce an unsigned test/release build.
      CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Install native dependencies
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg "$env:VCPKG_ROOT"
          & "$env:VCPKG_ROOT/bootstrap-vcpkg.bat" -disableMetrics
          & "$env:VCPKG_ROOT/vcpkg.exe" install ffmpeg libsamplerate soundtouch --triplet x64-windows
      - name: Build signed Windows installer
        run: npm run build:win -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml

  package-macos:
    needs: verify-version
    runs-on: macos-14
    timeout-minutes: 45
    env:
      # Leave signing/notarization secrets unset to produce an unsigned build.
      CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install native dependencies
        run: brew install ffmpeg libsamplerate sound-touch
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Build signed and notarized macOS package
        run: npm run build:mac -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: macos-release
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/*.dmg.blockmap
            dist/*-mac.zip
            dist/*-mac.zip.blockmap
            dist/latest-mac.yml

  package-linux:
    needs: verify-version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install Linux packaging dependencies
        run: sudo snap install snapcraft --classic
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Build Linux packages
        run: npm run build:linux -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: linux-release
          if-no-files-found: error
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.snap
            dist/latest-linux.yml

  publish:
    needs: [package-windows, package-macos, package-linux]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref_type == 'tag'
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create GitHub release and upload artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" release-assets/* --title "$TAG" --generate-notes
