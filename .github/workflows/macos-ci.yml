name: macOS build

on:
  push:
    branches: ['**']
    tags-ignore: ['v*']
  pull_request:
  workflow_call:
    inputs:
      artifact_name:
        type: string
        default: macos-arm64-test

permissions:
  contents: read

# Daily CI can replace an older test build; release packaging has its own group.
concurrency:
  group: macos-ci-${{ github.ref }}-${{ inputs.artifact_name || 'macos-arm64-test' }}
  cancel-in-progress: ${{ github.ref_type != 'tag' && (inputs.artifact_name || 'macos-arm64-test') == 'macos-arm64-test' }}

jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      VCPKG_ROOT: ''
      MACOSX_DEPLOYMENT_TARGET: '12.0'
      EASY_PLAYER_NATIVE_ARCH: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Check Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - name: Install build tools
        run: brew install ninja autoconf automake libtool pkg-config
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Build optional CPU stem component
        run: npm run package:auto-mix
      - name: Prepare yt-dlp
        run: npm run prepare:ytdlp
      - name: Build pinned audio dependencies
        run: npm run prepare:native
      - name: Build macOS package
        run: npm run build:mac -- --publish never
      - name: Verify native material styles and dialogs
        run: npm run test:window-material
      - name: Verify codecs and metadata on Apple Silicon
        run: npm run test:audio-core
      - name: Verify DSP, Remix and backend recovery
        run: |
          npm run test:macos-runtime
          cmake -S tests/native -B build/macos-engine-tests -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0
          cmake --build build/macos-engine-tests --parallel 3
          ctest --test-dir build/macos-engine-tests --output-on-failure
      - name: Verify package without build SDK paths
        run: |
          mv build/native-deps/installed/arm64-osx-audio build/native-deps/installed/arm64-osx-audio-hidden
          npm run test:macos-package
          node scripts/test-audio-ffmpeg.mjs dist/mac-arm64/EasyPlayer.app/Contents/Resources/native
      - name: Verify installer and update assets
        run: |
          mac_name=$(node -p 'require("./package.json").name')
          mac_version=$(node -p 'require("./package.json").version')
          test -s "dist/${mac_name}-${mac_version}-mac-arm64.dmg"
          test -s "dist/${mac_name}-${mac_version}-mac-arm64.zip"
          compgen -G 'dist/*-mac.yml' > /dev/null
      - name: Verify offline separation, cache and component lifecycle
        run: |
          npm run test:bundled-auto-mix
          npm run test:auto-mix-runtime
          npm run test:auto-mix-component-install
          build/auto-mix-runtime/python/bin/python3 -I -B scripts/test_auto_mix_stem_worker.py
          EASY_PLAYER_STEM_PYTHON="$PWD/build/auto-mix-runtime/python/bin/python3" node scripts/test-auto-mix-stems.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name || 'macos-arm64-test' }}
          if-no-files-found: error
          path: |
            dist/*-mac-arm64.dmg
            dist/*-mac-arm64.dmg.blockmap
            dist/*-mac-arm64.zip
            dist/*-mac-arm64.zip.blockmap
            dist/*-mac.yml
            dist/easy-player-auto-mix-darwin-arm64-*.zip
            dist/easy-player-auto-mix-darwin-arm64.json
