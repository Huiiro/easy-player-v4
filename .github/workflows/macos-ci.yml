name: macOS build

on:
  push:
    branches: ['**']
    tags-ignore: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: macos-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install native dependencies
        run: brew install ffmpeg libsamplerate sound-touch
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Prepare yt-dlp
        run: npm run prepare:ytdlp
      - name: Build macOS package
        run: npm run build:mac -- --publish never
