name: macOS build

on:
  push:
    branches: ['**']
    tags-ignore: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-14
    timeout-minutes: 90
    env:
      VCPKG_ROOT: ''
      MACOSX_DEPLOYMENT_TARGET: '12.0'
      EASY_PLAYER_NATIVE_ARCH: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Check Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - name: Install build tools
        run: brew install ninja autoconf automake libtool pkg-config
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Prepare yt-dlp
        run: npm run prepare:ytdlp
      - name: Build pinned audio dependencies
        run: npm run prepare:native
      - name: Build macOS package
        run: npm run build:mac -- --publish never
      - name: Verify codecs and metadata on Apple Silicon
        run: npm run test:audio-core
      - name: Verify package without build SDK paths
        run: |
          mv build/native-deps/installed/arm64-osx-audio build/native-deps/installed/arm64-osx-audio-hidden
          npm run test:macos-package
          node scripts/test-audio-ffmpeg.mjs dist/mac-arm64/EasyPlayer.app/Contents/Resources/native
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-test
          if-no-files-found: error
          path: |
            dist/*-mac-arm64.dmg
            dist/*-mac-arm64.zip
            dist/*-mac-arm64.zip.blockmap
            dist/latest-mac.yml
