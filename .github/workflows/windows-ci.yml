name: Windows build

on:
  push:
    branches: ['**']
    tags-ignore: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      ELECTRON_BUILDER_7Z_FILTER: BCJ
      ELECTRON_BUILDER_COMPRESSION_LEVEL: '9'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install JavaScript dependencies
        run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Prepare yt-dlp
        run: npm run prepare:ytdlp
      - name: Install native dependencies
        run: npm run prepare:native
      - name: Build native addon
        run: npm run build:native
      - name: Verify core audio formats and metadata writing
        run: npm run test:audio-core
      - name: Verify dependency cache and VC++ packaging checks
        run: npm run test:packaging-deps
      - name: Build optional CPU stem component
        run: npm run package:auto-mix
      - name: Prepare bundled FFmpeg
        run: npm run prepare:ffmpeg
      - name: Build unpacked Windows application
        shell: pwsh
        run: |
          $env:ELECTRON_BUILDER_7Z_FILTER = 'BCJ'
          $env:ELECTRON_BUILDER_COMPRESSION_LEVEL = '9'
          npm run build:nocheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/package-windows.mjs --dir --publish never
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-windows-package.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:bundled-auto-mix
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:auto-mix-runtime
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:auto-mix-component-install
