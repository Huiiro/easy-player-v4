name: Windows build

on:
  push:
    branches: ['**']
    tags-ignore: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      ELECTRON_BUILDER_7Z_FILTER: BCJ
      ELECTRON_BUILDER_COMPRESSION_LEVEL: '9'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Install native dependencies
        shell: pwsh
        run: |
          $env:VCPKG_ROOT = Join-Path $env:RUNNER_TEMP 'easy-player-vcpkg'
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "VCPKG_ROOT=$env:VCPKG_ROOT"
          git clone https://github.com/microsoft/vcpkg "$env:VCPKG_ROOT"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:VCPKG_ROOT/bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:VCPKG_ROOT/vcpkg.exe" install ffmpeg libsamplerate soundtouch --triplet x64-windows
      - name: Build native addon
        run: npm run build:native
      - name: Build unpacked Windows application
        shell: pwsh
        run: |
          $env:ELECTRON_BUILDER_7Z_FILTER = 'BCJ'
          $env:ELECTRON_BUILDER_COMPRESSION_LEVEL = '9'
          npm run build:nocheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx electron-builder --win --dir --publish never
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-windows-package.cjs
