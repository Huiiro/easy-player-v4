<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 -->
  <rect
    x="40"
    y="40"
    width="1520"
    height="820"
    rx="100"
    ry="100"
    fill="#fff5f8"
    fill-opacity="0.55"
    stroke="#ffd6e7"
    stroke-opacity="0.5"
    stroke-width="2"
  />

  <!-- 柔和光晕 -->
  <circle cx="500" cy="260" r="220" fill="#ffd9ec" fill-opacity="0.08"/>
  <circle cx="1150" cy="650" r="180" fill="#ffc2dd" fill-opacity="0.04"/>

  <!-- 频谱柱 -->
  <g fill="url(#sakuraGradient)" stroke="none">
    <rect x="585" y="420" width="30" height="180" rx="15"/>
    <rect x="635" y="370" width="30" height="230" rx="15"/>
    <rect x="685" y="310" width="30" height="290" rx="15"/>
    <rect x="735" y="245" width="30" height="355" rx="15"/>

    <!-- 中心高柱 -->
    <rect x="785" y="170" width="30" height="430" rx="15"/>

    <rect x="835" y="245" width="30" height="355" rx="15"/>
    <rect x="885" y="310" width="30" height="290" rx="15"/>
    <rect x="935" y="370" width="30" height="230" rx="15"/>
    <rect x="985" y="420" width="30" height="180" rx="15"/>
  </g>

  <!-- 漂浮樱花 -->
  <g fill="#ffd4e5" fill-opacity="0.7">
    <circle cx="420" cy="210" r="6"/>
    <circle cx="460" cy="260" r="4"/>
    <circle cx="1180" cy="240" r="5"/>
    <circle cx="1260" cy="320" r="7"/>
    <circle cx="1320" cy="700" r="5"/>
    <circle cx="320" cy="720" r="6"/>
  </g>

  <!-- 渐变定义 -->
  <defs>
    <linearGradient id="sakuraGradient" x1="0%" y1="100%" x2="0%" y2="0%">
      <!-- 底部 -->
      <stop offset="0%" stop-color="#ff8fb1"/>

      <!-- 中间 -->
      <stop offset="45%" stop-color="#ffb7cf"/>

      <!-- 顶部 -->
      <stop offset="100%" stop-color="#fff0f6"/>
    </linearGradient>
  </defs>
</svg>
