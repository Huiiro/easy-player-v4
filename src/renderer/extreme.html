<!doctype html>
<html data-playback-view="extreme">
  <head>
    <meta charset="UTF-8" />
    <title>Easy Player</title>
    <style>
      html:not([data-window-ready]) {
        background: #151515;
        color-scheme: dark;
      }
      html:not([data-window-ready]) body {
        margin: 0;
        background: inherit;
      }
      #startup-screen {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: grid;
        place-items: center;
        background: #151515;
        opacity: 1;
        visibility: visible;
        transition:
          opacity 640ms cubic-bezier(0.4, 0, 0.2, 1),
          visibility 0s linear 640ms;
        user-select: none;
        -webkit-app-region: drag;
      }
      #startup-screen img {
        display: block;
        width: 88px;
        height: 88px;
        object-fit: contain;
        -webkit-user-drag: none;
      }
      html[data-startup-hidden] #startup-screen {
        transition: none;
      }
      html[data-window-ready] #startup-screen {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        -webkit-app-region: no-drag;
      }
      html.reduce-motion #startup-screen,
      html.reduce-motion #startup-screen img {
        animation: none;
        transition: none;
      }
      @media (prefers-reduced-motion: reduce) {
        #startup-screen,
        #startup-screen img {
          animation: none;
          transition: none;
        }
      }
    </style>
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: easy-player-media: https:; media-src 'self' blob: file: easy-player-media: https://*.bilivideo.com:* https://*.bilivideo.cn:*; connect-src 'self' blob: file: easy-player-media://plugin-theme https://*.bilibili.com https://*.biligame.com https://*.bilivideo.com:* https://*.bilivideo.cn:*; frame-src easy-player-media://plugin-theme; font-src 'self' easy-player-media:"
    />
  </head>

  <body>
    <div id="startup-screen" role="status" aria-label="Easy Player">
      <img src="__STARTUP_LOGO__" alt="" width="88" height="88" />
    </div>
    <div id="app"></div>
    <script type="module" src="/src/startup.ts"></script>
  </body>
</html>
