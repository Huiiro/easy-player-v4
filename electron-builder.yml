appId: com.huiiro.easyplayer
productName: EasyPlayer
compression: maximum
beforePack: scripts/verify-auto-mix-package.cjs
directories:
  buildResources: build
files:
  - '!vcpkg{,/**/*}'
  # The desktop package runs the compiled Electron output only. Keep mobile
  # projects, native source trees and build artifacts out of app.asar.
  - '!{android-app,engine-android,mobile}/**/*'
  - '!{engine-core,engine-windows,engine-macos,tests}/**/*'
  - '!{build,dist,docs}/**/*'
  - '!{.agents,.github,.idea,.tools,.vscode,.update}/**/*'
  - '!{.nvmrc,*.tsbuildinfo}'
  - '!**/.git/**'
  - '!src/**/*'
  - '!plugins{,/**/*}'
  - '!packages{,/**/*}'
  - '!scripts{,/**/*}'
  - '!resources/**/*'
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  # Rebuild intermediates from native modules are not needed at runtime.
  - '!node_modules/better-sqlite3/{deps,src}/**/*'
  - '!node_modules/better-sqlite3/build/Release/obj{,/**/*}'
  - '!node_modules/better-sqlite3/build/Release/*.{iobj,ipdb,lib}'
electronLanguages:
  - en-US
  - zh-CN
extraResources:
  - from: 'resources/'
    to: 'resources/'
    filter:
      - '**/*'
      - '!lib{,/**/*}'
asarUnpack:
  - 'node_modules/kuromoji/dict/**'
  - resources/**
  - 'node_modules/better-sqlite3/**'
  - 'build/native-addon/**/*.node'
win:
  executableName: easy-player
  icon: resources/icons/easy-player.ico
  extraResources:
    - from: 'build/native-addon/'
      to: 'native/'
      filter:
        # Package the runtime at the root only. Release/ contains the same
        # addon as a DLL; development/test .node modules are not used by the app.
        - 'easy_player_native.node'
        - '*.dll'
        - 'ffmpeg.exe'
        - 'FFmpeg-LICENSE.txt'
        - 'ffmpeg-runtime.json'
        - 'msvc-runtime.json'
        - '!easy_player_native.dll'
    - from: 'build/taskbar-controls/bin/Release/easy_player_taskbar.exe'
      to: 'native/easy_player_taskbar.exe'
    - from: 'resources/lib/yt-dlp/win/yt-dlp.exe'
      to: 'lib/yt-dlp/yt-dlp.exe'
    - from: 'resources/lib/yt-dlp/win/yt-dlp.exe.manifest.json'
      to: 'lib/yt-dlp/yt-dlp.manifest.json'
  # extraFiles targets the application directory, while extraResources targets resources/.
  extraFiles:
    - from: 'build/native-addon/'
      to: '.'
      filter:
        - 'vcruntime*.dll'
        - 'msvcp*.dll'
        - 'msvcr*.dll'
        - 'concrt*.dll'
        - 'vccorlib*.dll'
nsis:
  include: scripts/file-associations.nsh
  artifactName: ${name}-${version}-setup.${ext}
  # Prefer a compact solid archive for the full installer.
  differentialPackage: false
  installerIcon: resources/icons/easy-player.ico
  uninstallerIcon: resources/icons/easy-player.ico
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  # Use the assisted installer so users can choose where to install and whether to launch.
  oneClick: false
  allowToChangeInstallationDirectory: true
  runAfterFinish: true
mac:
  minimumSystemVersion: '12.0'
  artifactName: '${name}-${version}-mac-${arch}.${ext}'
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  icon: resources/icons/easy-player.icns
  entitlementsInherit: build/entitlements.mac.plist
  extraResources:
    - from: 'build/native-addon/easy_player_native.node'
      to: 'native/easy_player_native.node'
    - from: 'build/native-addon/deps/'
      to: 'native/deps/'
      filter:
        - '**/*.dylib'
    - from: 'build/native-addon/ffmpeg'
      to: 'native/ffmpeg'
    - from: 'build/native-addon/macos-runtime.json'
      to: 'native/macos-runtime.json'
    - from: 'build/native-addon/FFmpeg-LICENSE.txt'
      to: 'native/FFmpeg-LICENSE.txt'
    - from: 'resources/lib/yt-dlp/mac/yt-dlp'
      to: 'lib/yt-dlp/yt-dlp'
    - from: 'resources/lib/yt-dlp/mac/yt-dlp.manifest.json'
      to: 'lib/yt-dlp/yt-dlp.manifest.json'
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
dmg:
  artifactName: ${name}-${version}-mac-${arch}.${ext}
linux:
  icon: resources/icons/easy-player.png
  extraResources:
    - from: 'resources/lib/yt-dlp/linux/${arch}/yt-dlp'
      to: 'lib/yt-dlp/yt-dlp'
    - from: 'resources/lib/yt-dlp/linux/${arch}/yt-dlp.manifest.json'
      to: 'lib/yt-dlp/yt-dlp.manifest.json'
  target:
    - AppImage
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: github
  owner: Huiiro
  repo: easy-player-v4
  releaseType: release
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
