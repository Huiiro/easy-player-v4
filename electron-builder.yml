appId: com.huiiro.easyplayer
productName: Easy Player
compression: maximum
directories:
  buildResources: build
files:
  # The desktop package runs the compiled Electron output only. Keep mobile
  # projects, native source trees and build artifacts out of app.asar.
  - '!{android-app,engine-android,mobile}/**/*'
  - '!{engine-core,engine-windows}/**/*'
  - '!{build,dist,docs}/**/*'
  - '!{.agents,.github,.idea,.tools,.vscode}/**/*'
  - '!**/.git/**'
  - '!src/**/*'
  - '!resources/**/*'
  - '!resources/tools/yt-dlp{,/**/*}'
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  # Rebuild intermediates from native modules are not needed at runtime.
  - '!node_modules/better-sqlite3/{deps,src}/**/*'
  - '!node_modules/better-sqlite3/build/Release/obj{,/**/*}'
  - '!node_modules/better-sqlite3/build/Release/*.{iobj,ipdb,lib}'
electronLanguages:
  - en-US
  - zh-CN
extraResources:
  - from: 'resources/'
    to: 'resources/'
    filter:
      - '**/*'
      - '!tools/yt-dlp{,/**/*}'
asarUnpack:
  - resources/**
  - 'node_modules/better-sqlite3/**'
  - 'build/native-addon/**/*.node'
win:
  executableName: easy-player
  icon: resources/easy-player.ico
  extraResources:
    - from: 'build/native-addon/'
      to: 'native/'
      filter:
        - '**/*.node'
        - '**/*.dll'
    - from: 'resources/tools/yt-dlp/win/yt-dlp.exe'
      to: 'tools/yt-dlp/yt-dlp.exe'
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  installerIcon: resources/easy-player.ico
  uninstallerIcon: resources/easy-player.ico
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  # Use the assisted installer so users can choose where to install and whether to launch.
  oneClick: false
  allowToChangeInstallationDirectory: true
  runAfterFinish: true
mac:
  icon: resources/easy-player.icns
  entitlementsInherit: build/entitlements.mac.plist
  extraResources:
    - from: 'build/native-addon/easy_player_native.node'
      to: 'native/easy_player_native.node'
    - from: 'build/native-addon/deps/'
      to: 'native/deps/'
      filter:
        - '**/*.dylib'
    - from: 'resources/tools/yt-dlp/mac/yt-dlp'
      to: 'tools/yt-dlp/yt-dlp'
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  icon: resources/easy-player.png
  extraResources:
    - from: 'resources/tools/yt-dlp/linux/${arch}/yt-dlp'
      to: 'tools/yt-dlp/yt-dlp'
  target:
    - AppImage
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: github
  owner: Huiiro
  repo: easy-player-v4
  releaseType: release
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
